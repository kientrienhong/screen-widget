name: screen_widget
description: Animated painted trees for your desktop — cherry blossom, mai vàng and a Christmas tree.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  window_manager: '>=0.4.3 <1.0.0'
  shared_preferences: ^2.3.2
  hotkey_manager: '>=0.2.0 <1.0.0'
  screen_retriever: '>=0.1.9 <1.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/trees/
    - assets/backgrounds/
    - assets/sprites/
