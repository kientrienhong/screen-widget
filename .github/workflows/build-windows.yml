# Builds the Windows app on GitHub's Windows machines, so you can get a .exe
# without a Windows PC. Run it from the repo's Actions tab ("Run workflow"),
# or push a tag like v1.0.0. The run's "Artifacts" has ScreenWidget-Setup.exe
# (one-file installer) and the zipped app folder.
name: Build Windows .exe

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner (if not committed)
        shell: pwsh
        run: |
          if (-not (Test-Path windows\runner)) {
            flutter create --platforms=windows --project-name screen_widget --org com.harley .
          }

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Add the Visual C++ runtime DLLs
        # So the app also starts on PCs that don't have the VC++ redistributable.
        shell: pwsh
        run: |
          $exe = Get-ChildItem build\windows -Recurse -Filter screen_widget.exe | Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item (Join-Path $env:SystemRoot "System32\$dll") $exe.DirectoryName -Force
          }
          "RELEASE_DIR=$($exe.DirectoryName)" >> $env:GITHUB_ENV

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value)
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DSourceDir=$env:RELEASE_DIR" windows\installer\screen_widget.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zip the app folder
        shell: pwsh
        run: Compress-Archive -Path (Join-Path $env:RELEASE_DIR '*') -DestinationPath ScreenWidget-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenWidget-Setup
          path: build/installer/ScreenWidget-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenWidget-windows
          path: ScreenWidget-windows.zip
